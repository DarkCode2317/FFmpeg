name: Check Android SDK and NDK

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Android environment
        run: |
          echo "=== OS ==="
          cat /etc/os-release

          echo
          echo "=== ANDROID_HOME ==="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo
          echo "=== Android SDK ==="
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "SDK found"
            ls -la "$ANDROID_HOME"
          else
            echo "Android SDK not found"
          fi

          echo
          echo "=== SDK Manager ==="
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            echo "sdkmanager not found"
          fi

          echo
          echo "=== Installed SDK Platforms ==="
          if [ -d "$ANDROID_HOME/platforms" ]; then
            find "$ANDROID_HOME/platforms" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -printf '%f\n' |
              sort -V
          else
            echo "No platforms directory"
          fi

          echo
          echo "=== Installed Build Tools ==="
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            find "$ANDROID_HOME/build-tools" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -printf '%f\n' |
              sort -V
          else
            echo "No build-tools directory"
          fi

          echo
          echo "=== Installed NDKs ==="
          if [ -d "$ANDROID_HOME/ndk" ]; then
            find "$ANDROID_HOME/ndk" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -printf '%f\n' |
              sort -V
          else
            echo "No NDK directory"
          fi

          echo
          echo "=== NDK environment variables ==="
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"

          echo
          echo "=== NDK Latest ==="
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] &&
             [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDK path: $ANDROID_NDK_LATEST_HOME"

            if [ -f "$ANDROID_NDK_LATEST_HOME/source.properties" ]; then
              cat "$ANDROID_NDK_LATEST_HOME/source.properties"
            fi
          else
            echo "ANDROID_NDK_LATEST_HOME not found"
          fi