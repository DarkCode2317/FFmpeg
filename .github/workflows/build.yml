name: Build FFmpeg Android Native Excuatable Files

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'armv7-a'
        type: choice
        options:
          - armv7-a
          - arm64-v8a
          - x86
          - x86_64
      api_level:
        description: 'Android API Level'
        required: true
        default: '21'
        type: choice
        options:
          - '21'
          - '24'
          - '28'
          - '29'
          - '30'

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      NDK_VERSION: "27.2.12479018"
      API_LEVEL: ${{ inputs.api_level || '21' }}
      TARGET_ARCH: ${{ inputs.arch || 'armv7-a' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;$NDK_VERSION"

      - name: Set NDK Path
        run: |
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            yasm \
            nasm

      - name: Determine arch settings
        run: |
          case "${{ env.TARGET_ARCH }}" in
            armv7-a)
              echo "ARCH=arm" >> $GITHUB_ENV
              echo "CPU=armv7-a" >> $GITHUB_ENV
              echo "CROSS_PREFIX=armv7a-linux-androideabi" >> $GITHUB_ENV
              echo "ARCH_SUFFIX=armv7" >> $GITHUB_ENV
              echo "NEON=--enable-neon" >> $GITHUB_ENV
              ;;
            arm64-v8a)
              echo "ARCH=aarch64" >> $GITHUB_ENV
              echo "CPU=cortex-a53" >> $GITHUB_ENV
              echo "CROSS_PREFIX=aarch64-linux-android" >> $GITHUB_ENV
              echo "ARCH_SUFFIX=arm64" >> $GITHUB_ENV
              echo "NEON=--enable-neon" >> $GITHUB_ENV
              ;;
            x86)
              echo "ARCH=x86" >> $GITHUB_ENV
              echo "CPU=i686" >> $GITHUB_ENV
              echo "CROSS_PREFIX=i686-linux-android" >> $GITHUB_ENV
              echo "ARCH_SUFFIX=x86" >> $GITHUB_ENV
              echo "NEON=" >> $GITHUB_ENV
              ;;
            x86_64)
              echo "ARCH=x86_64" >> $GITHUB_ENV
              echo "CPU=x86-64" >> $GITHUB_ENV
              echo "CROSS_PREFIX=x86_64-linux-android" >> $GITHUB_ENV
              echo "ARCH_SUFFIX=x86_64" >> $GITHUB_ENV
              echo "NEON=" >> $GITHUB_ENV
              ;;
          esac

      - name: Configure FFmpeg
        run: |
          TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64
          
          ./configure \
            --prefix=$PWD/out \
            --target-os=android \
            --arch=${{ env.ARCH }} \
            --cpu=${{ env.CPU }} \
            --enable-cross-compile \
            --sysroot=$TOOLCHAIN/sysroot \
            --cc=$TOOLCHAIN/bin/${{ env.CROSS_PREFIX }}${{ env.API_LEVEL }}-clang \
            --cxx=$TOOLCHAIN/bin/${{ env.CROSS_PREFIX }}${{ env.API_LEVEL }}-clang++ \
            --ar=$TOOLCHAIN/bin/llvm-ar \
            --ranlib=$TOOLCHAIN/bin/llvm-ranlib \
            --strip=$TOOLCHAIN/bin/llvm-strip \
            --nm=$TOOLCHAIN/bin/llvm-nm \
            --enable-gpl \
            --enable-version3 \
            ${{ env.NEON }} \
            --enable-jni \
            --enable-mediacodec \
            --enable-lto \
            --disable-network \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libdav1d \
            --enable-libaom \
            --enable-librav1e \
            --enable-libvpx \
            --enable-libwebp \
            --enable-libopenjpeg \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libflac \
     --enable-libopencore-amrnb \
     --enable-libopencore-amrwb \
    --enable-libvo-amrwbenc \
    --enable-libass \
    --enable-libfreetype \
    --enable-libfontconfig \
    --enable-libharfbuzz \
    --enable-libfribidi \
    --enable-libzimg \
    --enable-libsoxr \
    --enable-librubberband \
    --enable-libvidstab \
    --enable-libbluray \
    --enable-libdvdnav \
    --enable-libdvdread \
    --enable-libxml2

      - name: Build FFmpeg
        run: |
          make -j$(nproc)

      - name: Strip binaries
        run: |

TOOLCHAIN=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64
         STRIP=$TOOLCHAIN/bin/llvm-strip

          [ -f ffmpeg ] && $STRIP --strip-all ffmpeg && echo "Stripped ffmpeg" || true
          [ -f ffprobe ] && $STRIP --strip-all ffprobe && echo "Stripped ffprobe" || true

          echo "=== Final Binary Sizes ==="
          ls -lh ffmpeg ffprobe 2>/dev/null || true

      - name: Prepare output
        run: |
          mkdir -p build-output

          if [ -f ffmpeg ]; then
            cp ffmpeg build-output/ffmpeg
            chmod +x build-output/ffmpeg
            echo "ffmpeg copied!"
          fi

          if [ -f ffprobe ]; then
            cp ffprobe build-output/ffprobe
            chmod +x build-output/ffprobe
            echo "ffprobe copied!"
          fi

          cat > build-output/README.md << 'EOFMD'
          FFmpeg Android native executable build
          EOFMD

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-${{ env.ARCH_SUFFIX }}-api${{ env.API_LEVEL }}
          path: build-output/
          retention-days: 30
          if-no-files-found: error