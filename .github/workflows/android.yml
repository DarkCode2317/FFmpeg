name: Build FFmpeg Android ARMv7

on:
  workflow_dispatch:

env:
  ANDROID_API: 21
  X264_PREFIX: ${{ github.workspace }}/x264-install

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FFmpeg
        uses: actions/checkout@v4

      - name: Checkout x264
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/x264
          ref: stable
          path: x264

      - name: Set environment
        run: |
          echo "TOOLCHAIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Build x264
        working-directory: x264
        run: |
          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi${ANDROID_API}-clang" \
          CXX="$TOOLCHAIN/bin/armv7a-linux-androideabi${ANDROID_API}-clang++" \
          ./configure \
          --host=arm-linux-androideabi \          --sysroot="$TOOLCHAIN/sysroot" \
          --prefix="$X264_PREFIX" \
          --enable-static \
          --disable-cli \
          --disable-opencl \
          --disable-bashcompletion \
          --disable-interlaced \
          --bit-depth=8 \
          --chroma-format=420 \
          --enable-strip
          sed -i '/#define fseek fseeko/d' config.h
          sed -i '/#define ftell ftello/d' config.h

          make -j"$(nproc)"
          make install

      - name: Verify x264
        run: |
          find "$X264_PREFIX" -type f -exec ls -lh {} \;

      - name: Build FFmpeg
        if: false
        run: |

          ./configure \
            --target-os=android \
            --arch=arm \
            --cpu=armv7-a \
            --enable-cross-compile \
            --cc="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang" \
            --cxx="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang++" \
            --nm="$TOOLCHAIN/bin/llvm-nm" \
            --ar="$TOOLCHAIN/bin/llvm-ar" \
            --ranlib="$TOOLCHAIN/bin/llvm-ranlib" \
            --strip="$TOOLCHAIN/bin/llvm-strip" \
            --sysroot="$TOOLCHAIN/sysroot" \
          --disable-ffprobe \
          --disable-ffplay \
          --disable-doc \
          --disable-debug \
          --disable-avdevice \
          --disable-indevs \
          --disable-outdevs \
          --disable-devices \
          --disable-postproc \
          --disable-network \
          --disable-cuda-llvm \
          --disable-v4l2-m2m \
          --enable-mediacodec \
          --extra-cflags="-I$X264_PREFIX/include" \
          --extra-ldflags="-L$X264_PREFIX/lib" \
            \
          --enable-gpl \
          --enable-libx264
          make -j"$(nproc)"

      - name: Verify FFmpeg
        if: false
        run: |
          file ffmpeg
          ls -lh ffmpeg

      - name: Upload FFmpeg
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-armv7
          path: ffmpeg